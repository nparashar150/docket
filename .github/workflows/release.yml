name: Release binaries

# Two ways in, and only one of them runs day to day.
#
# workflow_call is how release-please.yml starts this the moment it cuts a
# release; see the comment there for why the release event cannot be relied on.
# The release event is kept anyway so that a release published by hand, or one
# re-published after a failed build, still gets its binaries without anyone
# having to remember a second step.
#
# Either way the release already exists. This workflow attaches to it and never
# creates one.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to attach the build to, for example v0.1.1.
        required: true
        type: string
  release:
    types: [published]

# gh release upload and gh release edit both write to the release.
permissions:
  contents: write

jobs:
  attach:
    # macOS 26 is the deployment target, and the SDK has to match.
    runs-on: macos-26

    # One name for the tag whichever way the run started. The inputs context is
    # empty on a release event, so the fallback picks the tag out of the event.
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The tag, not whatever main happens to be. The release commit is
          # already on main by the time this runs and main can move again while
          # the build is going; the binary has to be the code that was released.
          ref: ${{ env.TAG }}

      # The Xcode project is generated from project.yml and deliberately not
      # in the tree, so it has to be made before anything can be built.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # project.yml pins Manual signing against a real Apple Development
      # certificate and team, because macOS will not attach permission grants
      # to an ad-hoc identity - a developer building locally needs that. A
      # runner has neither the certificate nor the team, so the release build
      # overrides signing on the command line: ad-hoc identity ("-"), no team,
      # and the hardened runtime off, since it is only meaningful alongside a
      # real Developer ID and notarisation. Overriding here rather than
      # editing project.yml leaves local builds signing with the real
      # certificate. The release that comes out of this is unsigned in every
      # sense that matters to Gatekeeper, which is what RELEASE_NOTES tells
      # people to expect.
      #
      # MARKETING_VERSION comes from the tag rather than project.yml. The two
      # agree now that release-please updates project.yml as part of the
      # release, but the tag is the thing the release is actually named after,
      # so it stays the source.
      #
      # Both architectures, because the runner is Apple Silicon and would
      # otherwise produce a thin arm64 binary. macOS 26 is the last release
      # that runs on Intel Macs, and a thin build does not refuse to launch
      # there politely - it refuses to launch at all.
      # CFBundleVersion is the build identity macOS itself compares:
      # LaunchServices uses it to decide which of two copies of an app is
      # newer, and every update framework compares it rather than the
      # marketing string. It was pinned to 1 in project.yml and overridden
      # nowhere, so every release shipped as build 1 and nothing could tell
      # one from another.
      #
      # Packed into a single increasing integer, since it has to increase and
      # a dotted string does not compare numerically. Two digits each for
      # minor and patch, which is room enough long before the majors roll.
      - name: Derive the build number
        run: |
          VERSION="${TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          echo "BUILD=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))" >> "$GITHUB_ENV"

      - name: Build Release
        run: |
          echo "Building $TAG as CFBundleShortVersionString=${TAG#v} CFBundleVersion=$BUILD"
          xcodebuild build \
            -project Docket.xcodeproj \
            -scheme Docket \
            CURRENT_PROJECT_VERSION="$BUILD" \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${TAG#v}" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO

      # ditto, not zip: an .app is a bundle full of symlinks and executable
      # bits, and zip flattens both, and the extracted copy will not launch.
      - name: Zip the app
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Release/Docket.app \
            "Docket-${TAG}.zip"

      # A disk image as well as the zip, because it is what a Mac user expects
      # to download: it mounts, it shows the app beside an Applications alias,
      # and dragging across is the whole install. UDZO is the compressed
      # read-only format; the Applications symlink is what makes the drag
      # target appear without shipping a background image and a .DS_Store.
      - name: Build the disk image
        run: |
          STAGE="$(mktemp -d)/Docket"
          mkdir -p "$STAGE"
          ditto build/Build/Products/Release/Docket.app "$STAGE/Docket.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Docket" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "Docket-${TAG}.dmg"

      # --clobber so a re-run after a build failure replaces the assets instead
      # of stopping on the ones the first attempt managed to upload.
      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "Docket-${TAG}.dmg" \
            "Docket-${TAG}.zip" \
            --clobber

      # release-please writes the notes from the commits, which covers what
      # changed and nothing else. The standing half of the notes - macOS 26
      # requirement, how to get an unsigned app past Gatekeeper, what it asks
      # permission for - is not derivable from a commit log and is the part
      # people actually need, so it gets appended from the template.
      #
      # The template's placeholder section above "## Requirements" is skipped,
      # because there is nothing left for a person to fill in. That heading is
      # the coupling: rename it in the template and the footer quietly stops
      # appearing here.
      - name: Append the standing notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FOOTER="$(sed -n '/^## Requirements$/,$p' .github/RELEASE_NOTES_TEMPLATE.md)"
          if [ -z "$FOOTER" ]; then
            echo "::error::No '## Requirements' heading in .github/RELEASE_NOTES_TEMPLATE.md, so the install instructions are missing from this release."
            exit 1
          fi
          {
            gh release view "$TAG" --json body --jq .body
            printf '\n---\n\n%s\n' "$FOOTER"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
